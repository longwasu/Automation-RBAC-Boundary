admin_role: all_access

rules:
  - descriptions: "R1. ADMIN có mọi quyền đọc/ghi."
    roles: ["all_access"]
    methods: ["*"]
    paths: ["*"]
    effect: ALLOW

  - descriptions: "R2. Mọi Role trừ ADMIN không có quyền ghi vào /security/*"
    roles: ["*"]
    exclude_roles: ["all_access"]
    methods: ["POST", "PUT", "DELETE"]
    paths: ["/security"]
    effect: DENY
  
  - descriptions: "R3. [viewer, auditor, hunter] không có quyền ghi vào [/agents, /ruleset, /groups, /ar]"
    roles: ["nst_soc_viewer", "nst_compliance_auditor", "nst_threat_hunting_ro"]
    methods: ["POST", "PUT", "DELETE"]
    paths: ["/agents", "/ruleset", "/groups", "/ar"]
    effect: DENY

  - descriptions: "R4. [auditor, hunter] không có quyền đọc [/agents]"
    roles: ["nst_compliance_auditor", "nst_threat_hunting_ro"]
    methods: ["GET"]
    paths: ["/agents"]
    effect: DENY

  - descriptions: "R4. Chỉ ADMIN mới có quyền run-command"
    roles: ["*"]
    exclude_roles: ["all_access"]
    methods: ["POST"]
    paths: ["/ar/run-command"]
    effect: DENY

  - descriptions: "R5. [viewer, auditor, hunter] không có quyền thực thi Action Response ở mức độ High"
    roles: ["nst_soc_viewer", "nst_compliance_auditor", "nst_threat_hunting_ro"]
    methods: ["POST"]
    paths: ["/ar/isolate", "/ar/kill-process", "/ar/quarantine-file"]
    effect: DENY